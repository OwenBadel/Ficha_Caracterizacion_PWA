services:
  - type: web
    name: ficha-caracterizacion-pwa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: VISION_PROVIDER
        value: ollama
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: qwen3-vl
      - key: GOOGLE_SHEET_TAB
        value: Respuestas
      - key: GOOGLE_SHEET_TAB_TESTS
        value: Pre_Post_Test
      - key: GOOGLE_SHEET_TAB_PATRON_MAESTRO
        value: PATRON MAESTRO
      - key: GOOGLE_SHEET_SKIP_FIRST_COL
        value: "true"
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_APPS_SCRIPT_URL
        sync: false
      - key: GOOGLE_APPS_SCRIPT_URL_TESTS
        sync: false
