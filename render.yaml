services:
  - type: web
    name: ficha-caracterizacion-pwa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: VISION_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_SHEET_TAB
        value: Respuestas
      - key: GOOGLE_SHEET_TAB_TESTS
        value: Pre_Post_Test
      - key: GOOGLE_SHEET_SKIP_FIRST_COL
        value: "true"
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_APPS_SCRIPT_URL
        sync: false
      - key: GOOGLE_APPS_SCRIPT_URL_TESTS
        sync: false
      - key: GOOGLE_SHEET_TAB_PRE_TEST
        value: PRE-TEST
      - key: GOOGLE_SHEET_TAB_POST_TEST
        value: POST-TEST
      - key: GOOGLE_SHEET_ID_ANEXO17
        sync: false
      - key: GOOGLE_APPS_SCRIPT_URL_ANEXO17
        sync: false
      - key: GOOGLE_SHEET_TAB_ANEXO17_PRE
        value: PRE-TEST
      - key: GOOGLE_SHEET_TAB_ANEXO17_POST
        value: POST-TEST
