services:
  - type: web
    name: ficha-caracterizacion-pwa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: VISION_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: qwen/qwen2.5-vl-72b-instruct
      - key: GOOGLE_SHEET_TAB
        value: Respuestas
      - key: GOOGLE_SHEET_TAB_TESTS
        value: Respuestas de formulario 1
      - key: GOOGLE_SHEET_SKIP_FIRST_COL
        value: "true"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_APPS_SCRIPT_URL
        sync: false
      - key: GOOGLE_APPS_SCRIPT_URL_TESTS
        sync: false
